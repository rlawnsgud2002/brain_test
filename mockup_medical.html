<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EEG Brain Visualization - Medical Clean</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
      color: #1a3a52;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    .container { display: flex; width: 100%; height: 100%; }
    .main { flex: 1; display: flex; flex-direction: column; padding: 20px; }
    .header { text-align: center; margin-bottom: 20px; font-size: 24px; color: #0066cc; font-weight: 600; }
    .content { display: flex; gap: 20px; flex: 1; }
    .visualization { flex: 1; background: #ffffff; border: 1px solid #d0d8e0; border-radius: 8px; padding: 20px; display: flex; flex-direction: column; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .canvas-container { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; }
    canvas { max-width: 100%; max-height: 100%; }
    .stats { display: flex; gap: 20px; margin-top: 20px; }
    .stat-box { flex: 1; background: linear-gradient(135deg, #f0f8ff 0%, #e6f2ff 100%); border: 1px solid #0066cc; padding: 15px; text-align: center; border-radius: 6px; }
    .stat-value { font-size: 28px; font-weight: bold; color: #0066cc; }
    .stat-label { font-size: 12px; color: #0066cc; margin-top: 5px; font-weight: 500; }
    .graph-container { flex: 1; background: #ffffff; border: 1px solid #d0d8e0; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .graph-title { color: #0066cc; font-size: 14px; margin-bottom: 10px; font-weight: 600; }
    .graph-canvas { width: 100%; height: 100%; }
    .admin-panel { width: 280px; background: #ffffff; border-left: 1px solid #d0d8e0; padding: 15px; overflow-y: auto; font-size: 12px; box-shadow: -2px 0 8px rgba(0,0,0,0.05); }
    .admin-section { margin-bottom: 20px; border-bottom: 1px solid #e8ecf1; padding-bottom: 10px; }
    .admin-title { color: #0066cc; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
    .slider-group { margin-bottom: 10px; }
    .slider-label { color: #1a3a52; font-size: 11px; font-weight: 500; }
    input[type="range"] { width: 100%; height: 4px; background: #d0d8e0; border: none; border-radius: 2px; margin-top: 4px; }
    input[type="range"]::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; background: #0066cc; border-radius: 50%; cursor: pointer; }
    input[type="range"]::-moz-range-thumb { width: 12px; height: 12px; background: #0066cc; border-radius: 50%; cursor: pointer; border: none; }
    button { background: #0066cc; color: #fff; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: 600; margin-top: 8px; width: 100%; font-family: inherit; }
    button:hover { background: #0052a3; }
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: #ffffff; border: 1px solid #d0d8e0; padding: 30px; border-radius: 8px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
    .modal-content input { background: #f5f7fa; color: #1a3a52; border: 1px solid #d0d8e0; padding: 8px; margin: 10px 0; width: 100%; border-radius: 4px; }
    .status { margin-top: 5px; font-size: 11px; color: #0066cc; min-height: 14px; font-weight: 500; }
    select { background: #f5f7fa; color: #1a3a52; border: 1px solid #d0d8e0; padding: 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="main">
      <div class="header">EEG Brain Concentration Monitoring</div>
      <div class="content">
        <div class="visualization">
          <div class="canvas-container">
            <canvas id="topoCanvas" width="400" height="400"></canvas>
          </div>
          <div class="stats">
            <div class="stat-box">
              <div class="stat-value" id="concentration">0%</div>
              <div class="stat-label">CONCENTRATION</div>
            </div>
            <div class="stat-box">
              <div class="stat-value" id="betaAlpha">1.0</div>
              <div class="stat-label">BETA/ALPHA RATIO</div>
            </div>
            <div class="stat-box">
              <div class="stat-value" id="status">IDLE</div>
              <div class="stat-label">BRAIN STATE</div>
            </div>
          </div>
        </div>
        <div class="graph-container">
          <div class="graph-title">Concentration Timeline (V-Pattern Detection)</div>
          <canvas id="graphCanvas" class="graph-canvas"></canvas>
        </div>
      </div>
    </div>
    <div class="admin-panel">
      <button onclick="openAdminPanel()">🔐 Admin Panel</button>
      <div id="adminContent" style="display:none;">
        <div class="admin-section">
          <div class="admin-title">DATA SOURCE</div>
          <select id="dataSource" onchange="changeDataSource()" style="width:100%; padding:4px;">
            <option value="simulate">SIMULATION</option>
            <option value="deap">DEAP DATASET</option>
          </select>
        </div>
        <div class="admin-section">
          <div class="admin-title">V-Pattern Configuration</div>
          <div class="slider-group">
            <div class="slider-label">Th_low (Relaxation): <span id="thLowValue">30</span>%</div>
            <input type="range" id="thLow" min="0" max="50" value="30" onchange="updateThresholds()">
          </div>
          <div class="slider-group">
            <div class="slider-label">Th_high (Focus): <span id="thHighValue">70</span>%</div>
            <input type="range" id="thHigh" min="50" max="100" value="70" onchange="updateThresholds()">
          </div>
          <div class="slider-group">
            <div class="slider-label">Δt (Time Window): <span id="deltaValue">3</span>s</div>
            <input type="range" id="delta" min="1" max="10" value="3" onchange="updateThresholds()">
          </div>
        </div>
        <div class="admin-section">
          <div class="admin-title">MANUAL CONTROL</div>
          <div class="slider-group">
            <div class="slider-label">Concentration Level: <span id="manualValue">50</span>%</div>
            <input type="range" id="manual" min="0" max="100" value="50" onchange="updateManual()">
          </div>
          <button onclick="triggerVPattern()">Trigger V-Pattern</button>
          <div class="status" id="status2"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="adminModal" class="modal" onclick="if(event.target===this) closeAdminPanel()">
    <div class="modal-content">
      <div style="font-size:16px; margin-bottom:15px; color:#0066cc; font-weight:600;">Admin Authentication</div>
      <input type="password" id="adminPassword" placeholder="Enter password" onkeypress="if(event.key==='Enter') verifyAdmin()">
      <div style="margin-top:15px;">
        <button onclick="verifyAdmin()" style="margin-right:5px; display:inline-block; width:45%;">OK</button>
        <button onclick="closeAdminPanel()" style="margin-left:5px; display:inline-block; width:45%; background:#999;">CANCEL</button>
      </div>
    </div>
  </div>

  <script>
    const CONFIG = {
      adminPassword: 'admin',
      thLow: 30, thHigh: 70, deltaTime: 3,
      electrodes: [
        {name:'AF3', x:-0.26, y:-0.60}, {name:'AF4', x:0.26, y:-0.60},
        {name:'F7', x:-0.72, y:-0.48}, {name:'F3', x:-0.38, y:-0.32},
        {name:'F4', x:0.38, y:-0.32}, {name:'F8', x:0.72, y:-0.48},
        {name:'FC5', x:-0.59, y:-0.13}, {name:'FC6', x:0.59, y:-0.13},
        {name:'T7', x:-0.85, y:0.05}, {name:'T8', x:0.85, y:0.05},
        {name:'P7', x:-0.66, y:0.50}, {name:'P8', x:0.66, y:0.50},
        {name:'O1', x:-0.26, y:0.72}, {name:'O2', x:0.26, y:0.72}
      ],
      values: new Float32Array(14).fill(50),
      history: [],
      manualControl: false,
      manualValue: 50,
      lastVPatternTime: 0
    };

    function openAdminPanel() {
      document.getElementById('adminModal').style.display='flex';
    }
    function closeAdminPanel() {
      document.getElementById('adminModal').style.display='none';
      document.getElementById('adminPassword').value='';
      document.getElementById('adminContent').style.display='none';
    }
    function verifyAdmin() {
      if(document.getElementById('adminPassword').value === CONFIG.adminPassword) {
        document.getElementById('adminContent').style.display='block';
        document.getElementById('adminModal').style.display='none';
      } else {
        alert('INCORRECT PASSWORD');
      }
    }

    function updateThresholds() {
      CONFIG.thLow = parseInt(document.getElementById('thLow').value);
      CONFIG.thHigh = parseInt(document.getElementById('thHigh').value);
      CONFIG.deltaTime = parseInt(document.getElementById('delta').value);
      document.getElementById('thLowValue').textContent = CONFIG.thLow;
      document.getElementById('thHighValue').textContent = CONFIG.thHigh;
      document.getElementById('deltaValue').textContent = CONFIG.deltaTime;
    }
    function updateManual() {
      CONFIG.manualValue = parseInt(document.getElementById('manual').value);
      CONFIG.manualControl = true;
      document.getElementById('manualValue').textContent = CONFIG.manualValue;
    }
    function triggerVPattern() {
      CONFIG.history = [];
      CONFIG.manualControl = true;
      for(let i=0; i<14; i++) CONFIG.values[i] = 20 + Math.random()*15;
      let step = 0;
      const rise = setInterval(() => {
        step++;
        const v = 20 + (step/30)*70;
        for(let i=0; i<14; i++) CONFIG.values[i] = v + (Math.random()-0.5)*10;
        if(step >= 30) { clearInterval(rise); CONFIG.manualControl = false; }
      }, 100);
      document.getElementById('status2').textContent = '✓ V-Pattern triggered';
      setTimeout(() => document.getElementById('status2').textContent='', 3000);
    }
    function changeDataSource() {
      // Placeholder for data source switching
    }

    function simulateEEG() {
      if(CONFIG.manualControl) {
        for(let i=0; i<14; i++) {
          CONFIG.values[i] = Math.max(0, Math.min(100, CONFIG.manualValue + (Math.random()-0.5)*20));
        }
      } else {
        for(let i=0; i<14; i++) {
          CONFIG.values[i] += (Math.random()-0.5)*10;
          CONFIG.values[i] = Math.max(0, Math.min(100, CONFIG.values[i]));
        }
      }
      const avg = Array.from(CONFIG.values).reduce((a,b)=>a+b)/14;
      CONFIG.history.push(avg);
      if(CONFIG.history.length > 100) CONFIG.history.shift();
      return avg;
    }

    function drawTopography(ctx, concentration) {
      const centerX = ctx.canvas.width/2, centerY = ctx.canvas.height/2, radius = 150;
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);

      // Draw scalp circle
      ctx.strokeStyle='#0066cc'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(centerX, centerY, radius, 0, Math.PI*2); ctx.stroke();

      // Draw cross
      ctx.strokeStyle='rgba(0,102,204,0.2)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(centerX-20, centerY); ctx.lineTo(centerX+20, centerY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(centerX, centerY-20); ctx.lineTo(centerX, centerY+20); ctx.stroke();

      // Draw heatmap
      const imageData = ctx.createImageData(ctx.canvas.width, ctx.canvas.height);
      const data = imageData.data;
      for(let py=0; py<ctx.canvas.height; py++) {
        for(let px=0; px<ctx.canvas.width; px++) {
          const nx = (px - centerX) / radius, ny = (py - centerY) / radius;
          if(nx*nx + ny*ny > 1) continue;

          let val=0, wsum=0;
          for(let ei=0; ei<CONFIG.electrodes.length; ei++) {
            const e = CONFIG.electrodes[ei];
            const dist = Math.sqrt((nx-e.x)**2 + (ny-e.y)**2);
            const w = Math.exp(-(dist**2)/0.3);
            val += CONFIG.values[ei] * w;
            wsum += w;
          }
          val = val/wsum;

          const idx = (py*ctx.canvas.width + px)*4;
          if(val < 33) {
            data[idx]=50; data[idx+1]=150; data[idx+2]=200;
          } else if(val < 66) {
            data[idx]=0; data[idx+1]=180; data[idx+2]=100;
          } else {
            data[idx]=220; data[idx+1]=100; data[idx+2]=0;
          }
          data[idx+3] = 200;
        }
      }
      ctx.putImageData(imageData, 0, 0);

      // Draw electrodes
      CONFIG.electrodes.forEach((e, i) => {
        const ex = centerX + e.x*radius, ey = centerY + e.y*radius;
        ctx.fillStyle = `hsl(200, 70%, ${70-CONFIG.values[i]*0.2}%)`;
        ctx.beginPath(); ctx.arc(ex, ey, 5, 0, Math.PI*2); ctx.fill();
      });
    }

    function drawGraph(ctx) {
      // Sync backing-store resolution to displayed size so the timeline isn't
      // drawn at the default 300×150 then stretched (blurry / wrong aspect).
      const cw = ctx.canvas.clientWidth, ch = ctx.canvas.clientHeight;
      if(cw > 0 && ch > 0 && (ctx.canvas.width !== cw || ctx.canvas.height !== ch)) {
        ctx.canvas.width = cw; ctx.canvas.height = ch;
      }
      ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);
      ctx.strokeStyle='#0066cc'; ctx.lineWidth=2;

      const history = CONFIG.history;
      if(history.length < 2) return;

      const h = ctx.canvas.height, w = ctx.canvas.width;
      const padding = 20, graphW = w - 2*padding, graphH = h - 2*padding;

      ctx.beginPath();
      for(let i=0; i<history.length; i++) {
        const x = padding + (i/(history.length-1))*graphW;
        const y = h - padding - (history[i]/100)*graphH;
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();

      // Thresholds
      const thLowY = h - padding - (CONFIG.thLow/100)*graphH;
      const thHighY = h - padding - (CONFIG.thHigh/100)*graphH;
      ctx.strokeStyle='rgba(0,102,204,0.3)'; ctx.lineWidth=1; ctx.setLineDash([5,5]);
      ctx.beginPath(); ctx.moveTo(padding, thLowY); ctx.lineTo(w-padding, thLowY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(padding, thHighY); ctx.lineTo(w-padding, thHighY); ctx.stroke();
      ctx.setLineDash([]);
    }

    function updateDisplay() {
      const concentration = simulateEEG();
      const betaAlpha = 0.5 + concentration/200;

      document.getElementById('concentration').textContent = Math.round(concentration) + '%';
      document.getElementById('betaAlpha').textContent = betaAlpha.toFixed(2);

      if(concentration < CONFIG.thLow) {
        document.getElementById('status').textContent = 'RELAXED';
        document.getElementById('status').style.color = '#00aa55';
      } else if(concentration > CONFIG.thHigh) {
        document.getElementById('status').textContent = 'FOCUSED';
        document.getElementById('status').style.color = '#ff6600';
      } else {
        document.getElementById('status').textContent = 'TRANSITION';
        document.getElementById('status').style.color = '#0066cc';
      }

      const ctx = document.getElementById('topoCanvas').getContext('2d');
      drawTopography(ctx, concentration);

      const gCtx = document.getElementById('graphCanvas').getContext('2d');
      drawGraph(gCtx);
    }

    setInterval(updateDisplay, 100);
  </script>
</body>
</html>
