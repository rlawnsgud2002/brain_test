<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EEG Brain Visualization - Dark Cyberpunk</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      color: #00ff88;
      font-family: 'Courier New', monospace;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    .container { display: flex; width: 100%; height: 100%; }
    .main { flex: 1; display: flex; flex-direction: column; padding: 20px; }
    .header { text-align: center; margin-bottom: 20px; font-size: 24px; text-shadow: 0 0 10px #00ff88; }
    .content { display: flex; gap: 20px; flex: 1; }
    .visualization { flex: 1; background: rgba(10,14,39,0.6); border: 2px solid #00ff88; border-radius: 8px; padding: 20px; display: flex; flex-direction: column; }
    .canvas-container { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; }
    canvas { max-width: 100%; max-height: 100%; }
    .stats { display: flex; gap: 20px; margin-top: 20px; }
    .stat-box { flex: 1; background: rgba(0,255,136,0.1); border: 1px solid #00ff88; padding: 15px; text-align: center; border-radius: 4px; }
    .stat-value { font-size: 28px; font-weight: bold; color: #00ff88; text-shadow: 0 0 10px #00ff88; }
    .stat-label { font-size: 12px; color: #00aa55; margin-top: 5px; }
    .graph-container { flex: 1; background: rgba(10,14,39,0.6); border: 2px solid #ff0080; border-radius: 8px; padding: 20px; }
    .graph-title { color: #ff0080; font-size: 14px; margin-bottom: 10px; text-shadow: 0 0 5px #ff0080; }
    .graph-canvas { width: 100%; height: 100%; }
    .admin-panel { width: 250px; background: rgba(10,14,39,0.7); border-left: 3px solid #ff0080; padding: 15px; overflow-y: auto; font-size: 12px; }
    .admin-section { margin-bottom: 20px; border-bottom: 1px solid rgba(255,0,128,0.3); padding-bottom: 10px; }
    .admin-title { color: #ff0080; font-size: 13px; font-weight: bold; margin-bottom: 8px; }
    .slider-group { margin-bottom: 10px; }
    .slider-label { color: #00ff88; font-size: 11px; }
    input[type="range"] { width: 100%; height: 4px; background: #1a1f3a; border: none; border-radius: 2px; margin-top: 4px; }
    input[type="range"]::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; background: #00ff88; border-radius: 50%; cursor: pointer; }
    input[type="range"]::-moz-range-thumb { width: 12px; height: 12px; background: #00ff88; border-radius: 50%; cursor: pointer; border: none; }
    button { background: #ff0080; color: #fff; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 8px; width: 100%; font-family: 'Courier New', monospace; }
    button:hover { background: #ff1a99; text-shadow: 0 0 10px #ff0080; }
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: #1a1f3a; border: 2px solid #ff0080; padding: 30px; border-radius: 8px; text-align: center; }
    .modal-content input { background: #0a0e27; color: #00ff88; border: 1px solid #00ff88; padding: 8px; margin: 10px 0; width: 100%; }
    .status { margin-top: 5px; font-size: 11px; color: #ff0080; min-height: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="main">
      <div class="header">⚡ EEG BRAIN CONCENTRATION TRACKER</div>
      <div class="content">
        <div class="visualization">
          <div class="canvas-container">
            <canvas id="topoCanvas" width="400" height="400"></canvas>
          </div>
          <div class="stats">
            <div class="stat-box">
              <div class="stat-value" id="concentration">0%</div>
              <div class="stat-label">CONCENTRATION</div>
            </div>
            <div class="stat-box">
              <div class="stat-value" id="betaAlpha">1.0</div>
              <div class="stat-label">BETA/ALPHA RATIO</div>
            </div>
            <div class="stat-box">
              <div class="stat-value" id="status">IDLE</div>
              <div class="stat-label">BRAIN STATE</div>
            </div>
          </div>
        </div>
        <div class="graph-container">
          <div class="graph-title">📈 CONCENTRATION TIMELINE (V-PATTERN DETECTION)</div>
          <canvas id="graphCanvas" class="graph-canvas"></canvas>
        </div>
      </div>
    </div>
    <div class="admin-panel">
      <button onclick="openAdminPanel()">🔐 ADMIN PANEL</button>
      <div id="adminContent" style="display:none;">
        <div class="admin-section">
          <div class="admin-title">DATA SOURCE</div>
          <select id="dataSource" onchange="changeDataSource()" style="width:100%; padding:4px; background:#0a0e27; color:#00ff88; border:1px solid #00ff88;">
            <option value="simulate">SIMULATION</option>
            <option value="deap">DEAP DATASET</option>
          </select>
        </div>
        <div class="admin-section">
          <div class="admin-title">V-PATTERN CONFIG</div>
          <div class="slider-group">
            <div class="slider-label">Th_low (이완 임계값): <span id="thLowValue">30</span>%</div>
            <input type="range" id="thLow" min="0" max="50" value="30" onchange="updateThresholds()">
          </div>
          <div class="slider-group">
            <div class="slider-label">Th_high (집중 임계값): <span id="thHighValue">70</span>%</div>
            <input type="range" id="thHigh" min="50" max="100" value="70" onchange="updateThresholds()">
          </div>
          <div class="slider-group">
            <div class="slider-label">Δt (시간창): <span id="deltaValue">3</span>s</div>
            <input type="range" id="delta" min="1" max="10" value="3" onchange="updateThresholds()">
          </div>
        </div>
        <div class="admin-section">
          <div class="admin-title">MANUAL CONTROL</div>
          <div class="slider-group">
            <div class="slider-label">집중도 조작: <span id="manualValue">50</span>%</div>
            <input type="range" id="manual" min="0" max="100" value="50" onchange="updateManual()">
          </div>
          <button onclick="triggerVPattern()">⚡ FORCE V-PATTERN</button>
          <div class="status" id="status2"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="adminModal" class="modal" onclick="if(event.target===this) closeAdminPanel()">
    <div class="modal-content">
      <div style="font-size:16px; margin-bottom:15px;">ADMIN PASSWORD</div>
      <input type="password" id="adminPassword" placeholder="Enter password" onkeypress="if(event.key==='Enter') verifyAdmin()">
      <div style="margin-top:15px;">
        <button onclick="verifyAdmin()" style="margin-right:5px; display:inline-block; width:45%;">OK</button>
        <button onclick="closeAdminPanel()" style="margin-left:5px; display:inline-block; width:45%; background:#666;">CANCEL</button>
      </div>
    </div>
  </div>

  <script>
    const CONFIG = {
      adminPassword: 'admin',
      thLow: 30, thHigh: 70, deltaTime: 3,
      electrodes: [
        {name:'AF3', x:-0.26, y:-0.60}, {name:'AF4', x:0.26, y:-0.60},
        {name:'F7', x:-0.72, y:-0.48}, {name:'F3', x:-0.38, y:-0.32},
        {name:'F4', x:0.38, y:-0.32}, {name:'F8', x:0.72, y:-0.48},
        {name:'FC5', x:-0.59, y:-0.13}, {name:'FC6', x:0.59, y:-0.13},
        {name:'T7', x:-0.85, y:0.05}, {name:'T8', x:0.85, y:0.05},
        {name:'P7', x:-0.66, y:0.50}, {name:'P8', x:0.66, y:0.50},
        {name:'O1', x:-0.26, y:0.72}, {name:'O2', x:0.26, y:0.72}
      ],
      values: new Float32Array(14).fill(50),
      history: [],
      manualControl: false,
      manualValue: 50,
      lastVPatternTime: 0
    };

    function openAdminPanel() {
      document.getElementById('adminModal').style.display='flex';
    }
    function closeAdminPanel() {
      document.getElementById('adminModal').style.display='none';
      document.getElementById('adminPassword').value='';
      document.getElementById('adminContent').style.display='none';
    }
    function verifyAdmin() {
      if(document.getElementById('adminPassword').value === CONFIG.adminPassword) {
        document.getElementById('adminContent').style.display='block';
        document.getElementById('adminModal').style.display='none';
      } else {
        alert('INCORRECT PASSWORD');
      }
    }

    function updateThresholds() {
      CONFIG.thLow = parseInt(document.getElementById('thLow').value);
      CONFIG.thHigh = parseInt(document.getElementById('thHigh').value);
      CONFIG.deltaTime = parseInt(document.getElementById('delta').value);
      document.getElementById('thLowValue').textContent = CONFIG.thLow;
      document.getElementById('thHighValue').textContent = CONFIG.thHigh;
      document.getElementById('deltaValue').textContent = CONFIG.deltaTime;
    }
    function updateManual() {
      CONFIG.manualValue = parseInt(document.getElementById('manual').value);
      CONFIG.manualControl = true;
      document.getElementById('manualValue').textContent = CONFIG.manualValue;
    }
    function triggerVPattern() {
      CONFIG.history = [];
      for(let i=0; i<20; i++) {
        CONFIG.history.push(30 + Math.random()*10);
      }
      for(let i=0; i<30; i++) {
        CONFIG.history.push(30 + (i/30)*50 + Math.random()*10);
      }
      CONFIG.lastVPatternTime = Date.now();
      document.getElementById('status2').textContent = '✓ V-Pattern triggered';
      setTimeout(() => document.getElementById('status2').textContent='', 2000);
    }
    function changeDataSource() {
      // Placeholder for data source switching
    }

    function simulateEEG() {
      if(CONFIG.manualControl) {
        for(let i=0; i<14; i++) {
          CONFIG.values[i] = CONFIG.manualValue + (Math.random()-0.5)*20;
        }
      } else {
        for(let i=0; i<14; i++) {
          CONFIG.values[i] += (Math.random()-0.5)*10;
          CONFIG.values[i] = Math.max(0, Math.min(100, CONFIG.values[i]));
        }
      }
      const avg = Array.from(CONFIG.values).reduce((a,b)=>a+b)/14;
      CONFIG.history.push(avg);
      if(CONFIG.history.length > 100) CONFIG.history.shift();
      return avg;
    }

    function drawTopography(ctx, concentration) {
      const centerX = ctx.canvas.width/2, centerY = ctx.canvas.height/2, radius = 150;
      ctx.fillStyle = 'rgba(10,14,39,0.3)'; ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);

      // Draw scalp circle
      ctx.strokeStyle='#00ff88'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(centerX, centerY, radius, 0, Math.PI*2); ctx.stroke();

      // Draw cross
      ctx.strokeStyle='rgba(0,255,136,0.3)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(centerX-20, centerY); ctx.lineTo(centerX+20, centerY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(centerX, centerY-20); ctx.lineTo(centerX, centerY+20); ctx.stroke();

      // Draw heatmap
      const imageData = ctx.createImageData(ctx.canvas.width, ctx.canvas.height);
      const data = imageData.data;
      for(let py=0; py<ctx.canvas.height; py++) {
        for(let px=0; px<ctx.canvas.width; px++) {
          const nx = (px - centerX) / radius, ny = (py - centerY) / radius;
          if(nx*nx + ny*ny > 1) continue;

          let val=0, wsum=0;
          for(let e of CONFIG.electrodes) {
            const dist = Math.sqrt((nx-e.x)**2 + (ny-e.y)**2);
            const w = Math.exp(-(dist**2)/0.05);
            val += CONFIG.values[CONFIG.electrodes.indexOf(e)] * w;
            wsum += w;
          }
          val = val/wsum;

          const idx = (py*ctx.canvas.width + px)*4;
          if(val < 33) {
            data[idx]=0; data[idx+1]=val*2; data[idx+2]=50;
          } else if(val < 66) {
            data[idx]=0; data[idx+1]=200; data[idx+2]=100-val;
          } else {
            data[idx]=Math.min(255,val*3); data[idx+1]=255; data[idx+2]=0;
          }
          data[idx+3] = 200;
        }
      }
      ctx.putImageData(imageData, 0, 0);

      // Draw electrodes
      CONFIG.electrodes.forEach((e, i) => {
        const ex = centerX + e.x*radius, ey = centerY + e.y*radius;
        ctx.fillStyle = `hsl(120, 100%, ${60-CONFIG.values[i]*0.2}%)`;
        ctx.beginPath(); ctx.arc(ex, ey, 5, 0, Math.PI*2); ctx.fill();
      });
    }

    function drawGraph(ctx) {
      ctx.fillStyle='rgba(10,14,39,0.3)'; ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);
      ctx.strokeStyle='#ff0080'; ctx.lineWidth=2;

      const history = CONFIG.history;
      if(history.length < 2) return;

      const h = ctx.canvas.height, w = ctx.canvas.width;
      const padding = 20, graphW = w - 2*padding, graphH = h - 2*padding;

      ctx.beginPath();
      for(let i=0; i<history.length; i++) {
        const x = padding + (i/(history.length-1))*graphW;
        const y = h - padding - (history[i]/100)*graphH;
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();

      // Thresholds
      const thLowY = h - padding - (CONFIG.thLow/100)*graphH;
      const thHighY = h - padding - (CONFIG.thHigh/100)*graphH;
      ctx.strokeStyle='rgba(0,255,136,0.3)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(padding, thLowY); ctx.lineTo(w-padding, thLowY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(padding, thHighY); ctx.lineTo(w-padding, thHighY); ctx.stroke();
    }

    function updateDisplay() {
      const concentration = simulateEEG();
      const betaAlpha = 0.5 + concentration/200;

      document.getElementById('concentration').textContent = Math.round(concentration) + '%';
      document.getElementById('betaAlpha').textContent = betaAlpha.toFixed(2);

      if(concentration < CONFIG.thLow) {
        document.getElementById('status').textContent = 'RELAXED';
        document.getElementById('status').style.color = '#00ff88';
      } else if(concentration > CONFIG.thHigh) {
        document.getElementById('status').textContent = 'FOCUSED';
        document.getElementById('status').style.color = '#ffff00';
      } else {
        document.getElementById('status').textContent = 'TRANSITION';
        document.getElementById('status').style.color = '#ff0080';
      }

      const ctx = document.getElementById('topoCanvas').getContext('2d');
      drawTopography(ctx, concentration);

      const gCtx = document.getElementById('graphCanvas').getContext('2d');
      drawGraph(gCtx);
    }

    setInterval(updateDisplay, 100);
  </script>
</body>
</html>
